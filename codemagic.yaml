workflows:
  splitpane-arm64e:
    name: SplitPane arm64e deb
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      vars:
        SPLITPANE_DIR: splitpane
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: seagull-pair-build
          include: true
    scripts:
      - name: Toolchain check
        script: |
          set -e
          xcodebuild -version
          xcode-select -p
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          xcrun --find clang
          xcrun --find ld
          xcrun ld -v 2>&1 | head -2

      - name: Install dpkg
        script: |
          set -e
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            brew install dpkg
          fi
          dpkg-deb --version | head -1

      - name: Build (real Apple ld -fixup_chains, arm64e)
        script: |
          set -e
          cd "$SPLITPANE_DIR"
          python3 build-apple.py 2>&1 | tee apple-build.log

      - name: Verify artifact
        script: |
          set -e
          cd "$SPLITPANE_DIR"
          ls -la dist-apple/
          for f in dist-apple/*.deb; do
            echo "== $f"
            dpkg-deb --field "$f" Package Version Architecture
            sha256sum "$f"
            dpkg-deb --contents "$f" | grep -E 'dylib|Prefs' || true
          done

    artifacts:
      - splitpane/dist-apple/*.deb
      - splitpane/apple-build.log
