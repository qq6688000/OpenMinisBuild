workflows:
  splitpane-arm64e:
    name: SplitPane arm64e deb
    instance_type: mac_mini_m2
    max_build_duration: 40

    environment:
      # 只要 iOS SDK >= 16.1 就能编；build-apple.py 内部会严格校验并给出可读错误
      xcode: latest
      vars:
        SPLITPANE_DIR: splitpane

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: seagull-pair-build
          include: true

    scripts:
      - name: Toolchain check
        script: |
          set +e
          echo "--- Xcode"
          xcodebuild -version
          xcode-select -p
          echo "--- SDK"
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          echo "--- tools"
          xcrun --find clang
          xcrun --find ld
          xcrun ld -v 2>&1 | head -3
          echo "--- arch"
          uname -m
          set -e

      - name: Install dpkg
        script: |
          set -e
          export HOMEBREW_NO_AUTO_UPDATE=1
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            brew install dpkg
          fi
          dpkg-deb --version | head -1

      - name: Build (real Apple ld -fixup_chains, arm64e)
        script: |
          set -o pipefail
          cd "$SPLITPANE_DIR"
          python3 build-apple.py 2>&1 | tee apple-build.log

      - name: Verify artifact
        script: |
          set -e
          cd "$SPLITPANE_DIR"
          ls -la dist-apple/
          for f in dist-apple/*.deb; do
            echo "== $f"
            dpkg-deb --field "$f" Package Version Architecture
            sha256sum "$f"
            dpkg-deb --contents "$f" | grep -E 'dylib|Prefs' || true
          done
          echo "--- 关键符号自检"
          TMP=$(mktemp -d)
          dpkg-deb -x dist-apple/*.deb "$TMP"
          DYLIB=$(find "$TMP" -name 'SplitPane.dylib' | head -1)
          for sym in restoreOriginalSceneSettings restoreAllScenes "window killAll" "hitTest" "homeSwipe"; do
            if strings "$DYLIB" | grep -q "$sym"; then echo "OK   $sym"; else echo "MISS $sym"; fi
          done

    artifacts:
      - splitpane/dist-apple/*.deb
      - splitpane/apple-build.log
