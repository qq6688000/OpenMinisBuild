name: SplitPane arm64e deb
on:
  workflow_dispatch:
  push:
    branches: [seagull-pair-build]
    paths:
      - 'splitpane/**'
      - '.github/workflows/splitpane.yml'
permissions:
  contents: read
jobs:
  deb:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tool
        run: brew install dpkg
      - name: Build and verify (real Apple ld -fixup_chains)
        working-directory: splitpane
        run: |
          set -o pipefail
          python3 build-apple.py 2>&1 | tee apple-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SplitPane-arm64e
          path: |
            splitpane/dist-apple/*.deb
            splitpane/apple-build.log
          if-no-files-found: error
