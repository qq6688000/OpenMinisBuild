# Unsigned device IPA for OpenMinis (Minis), for sideloading (TrollStore / AltStore / Sideloadly).
# The app ships a Linux sandbox, so the native dependencies (iSH, FFmpeg, LAME, rclone)
# are built from source by the deps/ scripts BEFORE the app is compiled. First build
# takes 30-60+ minutes; the deps are cached so later builds are fast.
name: Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [workbuddy-1.15]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          # iSH and PRoot sandboxes are submodules; without them build_ish.sh fails.
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26.2 and verify SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.2"

      - name: Validate Apelin Swift model and templates
        run: sh Validation/Apelin/run-swift.sh

      - name: Validate Apelin native bridge and Swift logic
        run: sh Validation/ApelinNative/run-apple.sh

      - name: Install build tools
        run: |
          brew install ninja llvm libarchive pkg-config go meson lld ldid
          python3 -m pip install --user --break-system-packages meson 2>/dev/null || true

      - name: Fix VDSO linker (Homebrew llvm clang)
        # iSH's vdso custom_target hardcodes `-fuse-ld=lld`, but Homebrew's
        # llvm clang on the macOS runner rejects the short name ("invalid
        # linker name in argument '-fuse-ld=lld'"). Pointing -fuse-ld at the
        # absolute lld path bypasses the name check (LLVM uses any path verbatim).
        run: |
          # Prefer ld.lld (the Unix ELF linker); the generic `lld` driver is a
          # multi-target dispatcher and refuses to link directly.
          LLD=$(ls /opt/homebrew/opt/llvm/bin/ld.lld /opt/homebrew/opt/lld/bin/ld.lld /opt/homebrew/bin/ld.lld /opt/homebrew/opt/llvm/bin/lld /opt/homebrew/opt/lld/bin/lld /opt/homebrew/bin/lld 2>/dev/null | head -1)
          echo "ld.lld found at: ${LLD:-NONE}"
          /opt/homebrew/opt/llvm/bin/clang --version | head -1 || true
          if [ -z "$LLD" ]; then echo "!! no lld binary"; exit 1; fi
          sed -i.bak "s|-fuse-ld=lld|-fuse-ld=${LLD}|g" deps/ish/vdso/arm64/meson.build
          grep -n "fuse-ld" deps/ish/vdso/arm64/meson.build

      - name: Metal Toolchain
        # Recent Xcode ships the Metal toolchain as a separate component. FFmpeg's
        # configure probes for it and silently drops the Metal-backed deinterlace
        # filter when missing, so fetch it when possible, but don't fail the build.
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain unavailable; continuing"

      - name: Cache native deps
        id: deps
        uses: actions/cache@v5
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: openminis-deps-xcode26.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/build_lame.sh','deps/build_ffmpeg.sh','deps/build_ish.sh','deps/prepare_alpine_rootfs.sh','deps/build_rclone_ios.sh') }}

      - name: Build native deps
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          # go-json-experiment/json's alias.go needs encoding/json's v2
          # experiment symbols (json.SkipFunc / json.DiscardUnknownMembers),
          # and it matches the Go 1.25 series (go.mod says `go 1.25.5`).
          # Go 1.27.3's encoding/json reorganized these, so pin the toolchain.
          export GOEXPERIMENT=jsonv2
          export GOTOOLCHAIN=go1.25.5
          go version
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Resolve SwiftPM deps (retry on 504)
        run: |
          set -euo pipefail
          echo "==> resolve with retry"
          for attempt in 1 2 3 4 5 6; do
            echo "==> resolve attempt $attempt"
            if xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
              -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData -skipPackagePluginValidation \
              -resolvePackageDependencies 2>&1 | tee /tmp/resolve_$attempt.log; then
              echo "==> resolved OK on attempt $attempt"
              break
            fi
            if grep -q "504\|badResponseStatusCode" /tmp/resolve_$attempt.log; then
              echo "==> hit 504; sleeping 10s and retrying"
              sleep 10
              continue
            fi
            echo "==> non-504 failure; giving up"
            exit 1
          done

      - name: Compile (device, unsigned)
        run: |
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build

      - name: Stage on-device toolchain resources
        run: |
          set -euo pipefail
          OUT=src/ios/ToolchainResources; mkdir -p "$OUT"
          BASE="https://github.com/qq6688000/OpenMinisBuild/releases/download/native-toolchain-v1"
          fetch() { # prefix, suffix list, expected sha, output
            prefix=$1; list=$2; want=$3; out=$4
            rm -f "$out"
            for suffix in $list; do
              # Verify each chunk landed whole: a truncated download silently
              # corrupts the concatenation (seen while testing this pipeline).
              ok=0
              for attempt in 1 2 3 4 5; do
                rm -f "/tmp/c.$suffix"
                curl -fL --retry 3 -m 300 -o "/tmp/c.$suffix" "$BASE/$prefix$suffix" || true
                sz=$(stat -f%z "/tmp/c.$suffix" 2>/dev/null || echo 0)
                if [ "$sz" -gt 0 ] && { [ "$sz" -eq 4000000 ] || [ "$suffix" = "$last" ]; }; then
                  ok=1; break
                fi
                echo "   retry $suffix (got $sz bytes)"; sleep 3
              done
              [ "$ok" -eq 1 ] || { echo "!! chunk $prefix$suffix failed to download" >&2; exit 1; }
              cat "/tmp/c.$suffix" >> "$out"
            done
            got=$(shasum -a 256 "$out" | cut -d' ' -f1)
            echo "   $out sha256=$got"
            if [ "$got" != "$want" ]; then
              echo "!! checksum mismatch for $out: want $want" >&2; exit 1
            fi
          }
          last=aah
          fetch sdk- "aaa aab aac aad aae aaf aag aah" \
            ff94153313bb60e740b22edb548abe2e193dc84c78fc76f938f5222235f46aeb "$OUT/MinSDK.tgz"
          last=aak
          fetch tk-  "aaa aab aac aad aae aaf aag aah aai aaj aak" \
            8eda57419100a136ddba544410eb7dd7329e03e5abbcbbc060bcfdd1c0bdd835 "$OUT/MinToolchain.tgz"
          ls -lh "$OUT"

      - name: Verify provision extraction (real archives and Foundation)
        run: |
          set -euo pipefail
          clang -Wall -Wextra -Werror -Isrc/ios/NativeOffloads tests/native_signature_layout.c src/ios/NativeOffloads/NativeBuildMachOCore.c -o /tmp/native-signature-layout
          /tmp/native-signature-layout
          python3 tests/provision_extract.py src/ios/ToolchainResources/MinToolchain.tgz src/ios/ToolchainResources/MinSDK.tgz
          clang -fobjc-arc -framework Foundation -larchive -Isrc/ios/NativeOffloads tests/provision_foundation.m src/ios/NativeOffloads/NativeBuildProvision.m src/ios/NativeOffloads/NativeBuildToolchain.m src/ios/NativeOffloads/NativeBuildProcess.c src/ios/NativeOffloads/NativeBuildMachOCore.c -o /tmp/provision-foundation
          FIXTURE=$(mktemp -d)
          /tmp/provision-foundation src/ios/ToolchainResources/MinToolchain.tgz Toolchain "$FIXTURE/Minis.app/Toolchain"
          /tmp/provision-foundation src/ios/ToolchainResources/MinSDK.tgz iPhoneOS16.5.sdk "$FIXTURE/cache/iPhoneOS16.5.sdk"
          [ ! -d "$FIXTURE/Minis.app/iPhoneOS16.5.sdk" ]
          rm -rf "$FIXTURE"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "no .app produced"; exit 1; }
          echo "app: $APP"
          rm -rf Payload Minis-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/libexec/PlistBuddy -c "Add :MinisBuildRevision string $GITHUB_SHA" Payload/Minis.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :MinisBuildRun string $GITHUB_RUN_ID" Payload/Minis.app/Info.plist
          # Comparison variant: tools in bundle, SDK archive only.
          mkdir -p Payload/Minis.app/ToolchainResources
          rm -f Payload/Minis.app/ToolchainResources/MinToolchain.tgz
          tar xzf src/ios/ToolchainResources/MinToolchain.tgz -C Payload/Minis.app
          cp src/ios/ToolchainResources/MinSDK.tgz Payload/Minis.app/ToolchainResources/
          [ -f Payload/Minis.app/Toolchain/bin/clang ]
          [ ! -d Payload/Minis.app/iPhoneOS16.5.sdk ]
          python3 tests/sign_bundle_tools.py Payload/Minis.app/Toolchain
          # Sign EVERY Mach-O in the bundle, not just the app binary.
          # Only signing Minis.app/Minis left the three .appex binaries unsigned;
          # iOS then refuses to load the extension and the app crashes as soon as
          # a file/share entry point is touched. The original IPA has all three
          # signed, so that is the shape we must reproduce.
          ENT="Configs/Minis.native.entitlements"
          if ! command -v ldid >/dev/null 2>&1; then
            echo "!! ldid missing; IPA would ship unsigned extensions" >&2
            exit 1
          fi
          echo "==> signing app + extensions with $ENT"
          MAIN_ENT=/tmp/Minis-main-native.entitlements
          cp "$ENT" "$MAIN_ENT"
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.private.security.container-required' "$MAIN_ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :com.apple.private.security.container-required string com.openminis.app' "$MAIN_ENT"
          ldid -S"$MAIN_ENT" "Payload/Minis.app/Minis"
          for APPEX in Payload/Minis.app/PlugIns/*.appex; do
            [ -d "$APPEX" ] || continue
            BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX/Info.plist")
            echo "    $APPEX/$BIN"
            ldid -S"$ENT" "$APPEX/$BIN"
          done
          echo "==> verify every Mach-O is signed"
          fail=0
          for M in Payload/Minis.app/Minis Payload/Minis.app/PlugIns/*.appex/*; do
            [ -f "$M" ] || continue
            file "$M" | grep -q 'Mach-O' || continue
            if ldid -e "$M" >/dev/null 2>&1; then echo "    ok $(basename "$M")"; else
              echo "    UNSIGNED $(basename "$M")" >&2; fail=1; fi
          done
          [ "$fail" -eq 0 ] || { echo "!! unsigned binaries in bundle" >&2; exit 1; }
          [ -f Payload/Minis.app/ToolchainResources/MinSDK.tgz ]
          [ ! -f Payload/Minis.app/ToolchainResources/MinToolchain.tgz ]
          [ ! -d Payload/Minis.app/Toolchain/sdk ]
          zip -qry Minis-unsigned.ipa Payload
          ls -lh Minis-unsigned.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: Minis-unsigned-ipa
          path: Minis-unsigned.ipa
          retention-days: 30
