# Unsigned device IPA for OpenMinis (Minis), for sideloading (TrollStore / AltStore / Sideloadly).
# The app ships a Linux sandbox, so the native dependencies (iSH, FFmpeg, LAME, rclone)
# are built from source by the deps/ scripts BEFORE the app is compiled. First build
# takes 30-60+ minutes; the deps are cached so later builds are fast.
name: Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [workbuddy-1.15]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          # iSH and PRoot sandboxes are submodules; without them build_ish.sh fails.
          submodules: recursive
          fetch-depth: 0

      - name: Xcode
        run: xcodebuild -version

      - name: Install build tools
        run: |
          brew install ninja llvm libarchive pkg-config go meson lld ldid
          python3 -m pip install --user --break-system-packages meson 2>/dev/null || true

      - name: Fix VDSO linker (Homebrew llvm clang)
        # iSH's vdso custom_target hardcodes `-fuse-ld=lld`, but Homebrew's
        # llvm clang on the macOS runner rejects the short name ("invalid
        # linker name in argument '-fuse-ld=lld'"). Pointing -fuse-ld at the
        # absolute lld path bypasses the name check (LLVM uses any path verbatim).
        run: |
          # Prefer ld.lld (the Unix ELF linker); the generic `lld` driver is a
          # multi-target dispatcher and refuses to link directly.
          LLD=$(ls /opt/homebrew/opt/llvm/bin/ld.lld /opt/homebrew/opt/lld/bin/ld.lld /opt/homebrew/bin/ld.lld /opt/homebrew/opt/llvm/bin/lld /opt/homebrew/opt/lld/bin/lld /opt/homebrew/bin/lld 2>/dev/null | head -1)
          echo "ld.lld found at: ${LLD:-NONE}"
          /opt/homebrew/opt/llvm/bin/clang --version | head -1 || true
          if [ -z "$LLD" ]; then echo "!! no lld binary"; exit 1; fi
          sed -i.bak "s|-fuse-ld=lld|-fuse-ld=${LLD}|g" deps/ish/vdso/arm64/meson.build
          grep -n "fuse-ld" deps/ish/vdso/arm64/meson.build

      - name: Metal Toolchain
        # Recent Xcode ships the Metal toolchain as a separate component. FFmpeg's
        # configure probes for it and silently drops the Metal-backed deinterlace
        # filter when missing, so fetch it when possible, but don't fail the build.
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain unavailable; continuing"

      - name: Cache native deps
        id: deps
        uses: actions/cache@v5
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: openminis-deps-${{ runner.os }}-${{ hashFiles('deps/build_lame.sh','deps/build_ffmpeg.sh','deps/build_ish.sh','deps/prepare_alpine_rootfs.sh','deps/build_rclone_ios.sh') }}

      - name: Build native deps
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          # go-json-experiment/json's alias.go needs encoding/json's v2
          # experiment symbols (json.SkipFunc / json.DiscardUnknownMembers),
          # and it matches the Go 1.25 series (go.mod says `go 1.25.5`).
          # Go 1.27.3's encoding/json reorganized these, so pin the toolchain.
          export GOEXPERIMENT=jsonv2
          export GOTOOLCHAIN=go1.25.5
          go version
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Compile (device, unsigned)
        run: |
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "no .app produced"; exit 1; }
          echo "app: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" || true
          rm -rf Payload Minis-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          # TrollStore 未签名 IPA 需显式注入 entitlements（App Group 缺失会启动闪退）
          command -v ldid >/dev/null && { echo "==> inject App Group entitlements"; ldid -S"src/ios/Minis.entitlements" "Payload/Minis.app/Minis"; }
          zip -qry Minis-unsigned.ipa Payload
          ls -lh Minis-unsigned.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: Minis-unsigned-ipa
          path: Minis-unsigned.ipa
          retention-days: 30
