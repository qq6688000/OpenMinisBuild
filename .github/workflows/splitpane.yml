name: SplitPane arm64e deb
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deb:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tool
        run: command -v dpkg-deb || brew install dpkg
      - name: Build and verify arm64e release
        working-directory: splitpane
        run: |
          set -o pipefail
          python3 build-apple.py 2>&1 | tee apple-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SplitPane-1.0.2-macos-15
          path: |
            splitpane/dist-apple/*.deb
            splitpane/apple-build.log
          if-no-files-found: error
