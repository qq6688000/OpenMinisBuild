name: SplitPane arm64e deb
on:
  workflow_dispatch:
  push:
    branches: [seagull-pair-build]
    paths:
      - 'splitpane/**'
      - '.github/workflows/splitpane.yml'
permissions:
  contents: read
jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tool
        run: brew install dpkg || true
      - name: Build
        working-directory: splitpane
        run: |
          set -o pipefail
          python3 build-apple.py 2>&1 | tee apple-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SplitPane-${{ matrix.os }}
          path: |
            splitpane/dist-apple/*.deb
            splitpane/apple-build.log
          if-no-files-found: warn
